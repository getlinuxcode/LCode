<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E9BFF"/>
      <stop offset="1" stop-color="#4B3FD8"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4ECFF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1B1060" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Rounded-square app tile -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>
  <!-- Phone -->
  <g filter="url(#shadow)">
    <rect x="156" y="84" width="200" height="344" rx="44" fill="url(#screen)"/>
  </g>
  <rect x="226" y="104" width="60" height="16" rx="8" fill="#1D1D4F"/>
  <!-- Code brackets on the screen -->
  <g fill="none" stroke="#3B5BEA" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="222,212 186,256 222,300"/>
    <polyline points="290,212 326,256 290,300"/>
  </g>
  <line x1="268" y1="200" x2="244" y2="312" stroke="#7A4BF0" stroke-width="20" stroke-linecap="round"/>
  <rect x="226" y="398" width="60" height="8" rx="4" fill="#1D1D4F" opacity="0.5"/>
</svg>
